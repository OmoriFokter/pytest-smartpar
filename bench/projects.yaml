# Projects of the experiment. Every git project is pinned to a commit SHA
# (resolved with `git ls-remote` from the tag in `ref`, which is informational).
#
# Chosen after `python bench/setup_projects.py --survey` (Python 3.12): suites
# of different length - Pydantic (~6k small tests, ~20 s serial), networkx
# (~5.7k tests, ~1 min) and pylint (~2.2k tests, ~2 min). Rich and attrs were
# dropped: their suites take a few seconds, too short for parallel execution.
# `deselect` lists tests that fail "out of the box" or are not unit tests.
# Placeholders: {python} - the project's virtualenv interpreter.
# One interpreter version for every project of a series, so that results are
# comparable. 3.12: pydantic-core 2.23.4 (Pydantic v2.9.2) has no build for
# 3.14. A project may override it with its own `python:`.
# pytest is pinned to 8.3 in every venv: the same runner for all projects, and
# Pydantic v2.9.2 turns a pytest 9 deprecation warning into collection errors.
python: "3.12"

projects:
  - name: control_project
    # Inside this repository: copied into the workspace and committed there
    # as a snapshot, so `git clean -xdf` restores it like any clone.
    local: examples/control_project
    tests: tests
    install:
      - "{python} -m pip install pytest~=8.3.0"
    pytest_args: []
    deselect: []
    ground_truth: examples/control_project/ground_truth.json

  - name: pydantic
    repo: https://github.com/pydantic/pydantic.git
    ref: v2.9.2
    sha: 7cedbfb03df82ac55c844c97e6f975359cb51bb9
    tests: tests
    install:
      - "{python} -m pip install -e ."
      # The `testing` dependency group of Pydantic's pyproject.toml.
      - "{python} -m pip install cloudpickle pytz dirty-equals eval-type-backport pytest-mock pytest-pretty pytest-examples faker pytest-benchmark pytest-codspeed~=2.2.0 packaging jsonschema pytest~=8.3.0"
    pytest_args: []
    deselect:
      # Performance benchmarks, not unit tests.
      - tests/benchmarks
      # Fails out of the box in the survey.
      - tests/test_types.py::test_constraints_on_str_like
    status: selected

  - name: networkx
    repo: https://github.com/networkx/networkx.git
    ref: networkx-3.4.2
    sha: 2acf1590f82757c01a57b81b8c5dfb79e60aa416
    # Tests live next to the code (networkx/**/tests).
    tests: networkx
    install:
      - "{python} -m pip install -e .[default,test] pytest~=8.3.0"
    pytest_args: []
    deselect: []
    status: selected

  - name: pylint
    repo: https://github.com/pylint-dev/pylint.git
    ref: v3.3.1
    sha: 76bce72bc57cc8089e439cc9d22fed5806341ed4
    tests: tests
    install:
      - "{python} -m pip install -r requirements_test_min.txt pytest~=8.3.0"
    pytest_args: []
    deselect: []
    status: selected
