name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # Minimum and maximum supported pytest-xdist (pyproject.toml).
        xdist-version: ["3.3.1", "3.8.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]" "pytest-xdist==${{ matrix.xdist-version }}"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Tool tests
        run: python -m pytest

  xdist-compat:
    # smartpar relies on pytest-xdist's internal scheduler interface: run the
    # whole suite against every supported xdist release.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        xdist-version: ["3.3.1", "3.4.0", "3.5.0", "3.6.1", "3.7.0", "3.8.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]" "pytest-xdist==${{ matrix.xdist-version }}"
      - name: Tool tests
        run: python -m pytest

  control-project:
    # The whole method on examples/control_project: exact match with
    # ground_truth.json, then a demonstration run whose data is uploaded.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: End-to-end test against ground_truth.json
        run: python -m pytest -m control
      - name: Demonstration run (profile, detect, run)
        working-directory: examples/control_project
        run: |
          python -m pytest --smartpar-profile -q
          python -m pytest --smartpar-detect --smartpar-seed 2026 -q
          # The two NOD tests fail with ~20 % probability by design, so the
          # exit code of these runs is not checked here; the end-to-end test
          # above checks that nothing else fails.
          python -m pytest -n 4 --smartpar -q || true
          smartpar --dir .smartpar merge
          python -m pytest -n 4 --smartpar -q || true
          smartpar --dir .smartpar show
      - uses: actions/upload-artifact@v4
        with:
          name: control-project-smartpar
          path: examples/control_project/.smartpar/
